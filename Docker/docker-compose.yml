services:
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile/Dockerfile.frontend
    ports:
      - "80:80"

  backend:
    build:
      context: ..
      dockerfile: Dockerfile/Dockerfile.backend
    ports:
      - "3000:3000"

  prometheus:
    image: prom/prometheus

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
